# This is a Declarative Automation Bundle definition for dev_olist_bundle.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: dev_olist_bundle
  uuid: ff87f47e-51d6-4529-b1a9-256457cf9c59

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-8571ad2b-3589.cloud.databricks.com
    variables:
      catalog: olist_dev
      schema: dev
  prod:
    mode: production
    workspace:
      host: https://dbc-8571ad2b-3589.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/shinoyom89@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/shinoyom89@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: olist_dev
      schema: prod
    permissions:
      - user_name: shinoyom89@gmail.com
        level: CAN_MANAGE
